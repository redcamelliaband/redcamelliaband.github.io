<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Private preview of Overburning by Red Camellia."
    >

    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow, noarchive">

    <title>Overburning — Private Preview — Red Camellia</title>

    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=2">

    <meta name="theme-color" content="#111111">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/overburning.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>

<body class="preview-page">

    <main class="preview-main">

        <a
            class="preview-wordmark"
            href="index.html"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit the Red Camellia website"
        >

            <img
                src="images/logos/wordmark-white.png"
                alt="Red Camellia"
            >

        </a>

        <section
            class="preview-card"
            aria-labelledby="preview-title"
        >

            <img
                class="preview-artwork"
                src="images/artwork/overburning-cover.jpg"
                alt="Overburning single artwork"
            >

            <p class="preview-kicker">
                Private Preview
            </p>

            <h1
                class="preview-title"
                id="preview-title"
            >
                Overburning
            </h1>

            <p class="preview-release">
                Red Camellia
            </p>

            <div class="audio-player">

                <audio
                    id="overburning-audio"
                    preload="metadata"
                >
                    <source
                        src="audio/Overburning.mp3"
                        type="audio/mp3"
                    >
                    Your browser does not support HTML audio.
                </audio>

                <button
                    class="audio-play-button"
                    id="audio-play-button"
                    type="button"
                    aria-label="Play Overburning"
                >
                    <i
                        class="fa-solid fa-play"
                        aria-hidden="true"
                    ></i>
                </button>

                <div class="audio-controls">

                    <input
                        class="audio-progress"
                        id="audio-progress"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                        aria-label="Audio progress"
                    >

                    <div class="audio-times">

                        <span id="audio-current-time">
                            0:00
                        </span>

                        <span id="audio-duration">
                            4:15
                        </span>

                    </div>

                </div>

            </div>

            <p class="preview-date">
                Official Release • 21 August 2026
            </p>

            <p class="preview-note">
                This private preview stream has been provided ahead of the official release for media,
                radio and industry consideration. Please do not distribute publicly.
            </p>

            <a
                class="preview-back"
                href="https://redcamelliaband.com"
                target="_blank"
                rel="noopener noreferrer"
            >
                Visit the Red Camellia Website
            </a>

            <div class="preview-socials">

                <p class="preview-socials-heading">
                    Follow Red Camellia
                </p>

                <div class="preview-social-icons">

                    <a
                        href="https://www.instagram.com/redcamelliaband/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Red Camellia on Instagram"
                    >
                        <i
                            class="fa-brands fa-instagram"
                            aria-hidden="true"
                        ></i>
                    </a>

                    <a
                        href="https://www.tiktok.com/@redcamelliaband"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Red Camellia on TikTok"
                    >
                        <i
                            class="fa-brands fa-tiktok"
                            aria-hidden="true"
                        ></i>
                    </a>

                    <a
                        href="https://open.spotify.com/artist/2v7xfNq7JK9akvSWFZvmOX?si=IgLIqgGKTV2yJXPdZQ3G4A"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Red Camellia on Spotify"
                    >
                        <i
                            class="fa-brands fa-spotify"
                            aria-hidden="true"
                        ></i>
                    </a>

                    <a
                        href="https://music.apple.com/us/artist/red-camellia/1870162665"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Red Camellia on Apple Music"
                    >
                        <i
                            class="fa-brands fa-apple"
                            aria-hidden="true"
                        ></i>
                    </a>

                    <a
                        href="https://www.youtube.com/@RedCamelliaBand"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Red Camellia on YouTube"
                    >
                        <i
                            class="fa-brands fa-youtube"
                            aria-hidden="true"
                        ></i>
                    </a>

                </div>

            </div>

        </section>

    </main>

    <script>

        const audio = document.getElementById("overburning-audio");
        const playButton = document.getElementById("audio-play-button");
        const playIcon = playButton.querySelector("i");
        const progress = document.getElementById("audio-progress");
        const currentTime = document.getElementById("audio-current-time");
        const duration = document.getElementById("audio-duration");

        function formatTime(seconds) {

            if (!Number.isFinite(seconds)) return "0:00";

            const minutes = Math.floor(seconds / 60);

            const remainingSeconds = Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");

            return `${minutes}:${remainingSeconds}`;

        }

        function showPlayState() {

            playIcon.className = "fa-solid fa-play";
            playButton.setAttribute("aria-label", "Play Overburning");

        }

        function showPauseState() {

            playIcon.className = "fa-solid fa-pause";
            playButton.setAttribute("aria-label", "Pause Overburning");

        }

        playButton.addEventListener("click", async () => {

            try {

                if (audio.paused) {

                    await audio.play();

                } else {

                    audio.pause();

                }

            } catch (error) {

                console.error(error);

            }

        });

        audio.addEventListener("play", showPauseState);

        audio.addEventListener("pause", showPlayState);

        audio.addEventListener("loadedmetadata", () => {

            duration.textContent = formatTime(audio.duration);

        });

        audio.addEventListener("timeupdate", () => {

            if (!audio.duration) return;

            progress.value = (audio.currentTime / audio.duration) * 100;

            currentTime.textContent = formatTime(audio.currentTime);

        });

        progress.addEventListener("input", () => {

            if (!audio.duration) return;

            audio.currentTime = (progress.value / 100) * audio.duration;

        });

        audio.addEventListener("ended", () => {

            progress.value = 0;

            currentTime.textContent = "0:00";

            showPlayState();

        });

    </script>

</body>

</html>

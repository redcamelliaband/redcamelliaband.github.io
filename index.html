<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="The official website of Melbourne alternative rock band Red Camellia."
    >

    <title>Red Camellia</title>

    <link
        rel="icon"
        type="image/x-icon"
        href="/favicon/favicon.ico?v=2"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="96x96"
        href="/favicon/favicon-96x96.png?v=2"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/favicon/apple-touch-icon.png?v=2"
    >

    <meta
        name="theme-color"
        content="#111111"
        media="(prefers-color-scheme: light)"
    >

    <meta
        name="theme-color"
        content="#111111"
        media="(prefers-color-scheme: dark)"
    >

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header-hero.css">
    <link rel="stylesheet" href="css/music.css?v=2">
    <link rel="stylesheet" href="css/live.css">
    <link rel="stylesheet" href="css/video.css?v=7">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

        <nav
            class="site-nav"
            aria-label="Main navigation"
        >

            <a href="#music">
                MUSIC
            </a>

            <a href="#live">
                LIVE
            </a>

            <a href="#video">
                VIDEO
            </a>

        </nav>

    </header>


    <main>


        <!-- =================================================
             MUSIC
             ================================================= -->

        <section
            class="music"
            id="music"
        >

            <div class="release-carousel">

                <div class="release-track">


                    <!-- OVERBURNING -->

                    <article
                        class="release-slide release-slide-overburning"
                    >

                        <img
                            class="release-background overburning-background"
                            src="images/artwork/overburning-cover.jpg"
                            alt=""
                            aria-hidden="true"
                        >

                        <div
                            class="release-overlay overburning-overlay"
                        ></div>


                        <div class="overburning-content">

                            <img
                                class="overburning-artwork"
                                src="images/artwork/overburning-cover.jpg"
                                alt="Overburning single artwork"
                            >


                            <div class="overburning-info">

                                <p class="overburning-kicker">
                                    New Single
                                </p>

                                <a
                                    class="button overburning-presave-button"
                                    href="https://gyro.to/Overburning"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    Pre-Save
                                </a>

                            </div>

                        </div>

                    </article>


                    <!-- TREMBLING -->

                    <article
                        class="release-slide release-slide-trembling"
                    >

                        <img
                            class="release-background trembling-background"
                            src="images/backgrounds/music-background.jpg"
                            alt=""
                            aria-hidden="true"
                        >

                        <div
                            class="release-overlay trembling-overlay"
                        ></div>


                        <div class="trembling-content">

                            <img
                                class="trembling-artwork"
                                src="images/artwork/trembling-cover.jpg"
                                alt="Trembling single artwork"
                            >


                            <div class="trembling-info">

                                <a
                                    class="button trembling-button"
                                    href="https://gyro.to/Trembling"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    Listen
                                </a>

                            </div>

                        </div>

                    </article>

                </div>


                <!-- CAROUSEL CONTROLS -->

                <button
                    class="carousel-arrow carousel-arrow-left"
                    type="button"
                    aria-label="Previous release"
                >
                    ‹
                </button>

                <button
                    class="carousel-arrow carousel-arrow-right"
                    type="button"
                    aria-label="Next release"
                >
                    ›
                </button>


                <!-- CAROUSEL DOTS -->

                <div
                    class="carousel-dots"
                    aria-label="Choose a release"
                >

                    <button
                        class="carousel-dot active"
                        type="button"
                        aria-label="Show Overburning"
                    ></button>

                    <button
                        class="carousel-dot"
                        type="button"
                        aria-label="Show Trembling"
                    ></button>

                </div>

            </div>

        </section>



        <!-- =================================================
             LIVE
             ================================================= -->

        <section
            class="live"
            id="live"
        >


            <div class="live-image">

                <img
                    src="images/backgrounds/live-portrait.jpg"
                    alt="Red Camellia performing live"
                >

            </div>


            <div class="live-details">

                <div class="show-card">


                    <div class="show-release">

                        <p class="show-kicker">
                            Overburning
                        </p>

                        <p class="show-subtitle">
                            Single Launch
                        </p>

                    </div>


                    <div class="show-main">

                        <h3>
                            The Last Chance
                        </h3>

                        <p class="show-venue-subtitle">
                            Rock & Roll Bar
                        </p>

                        <p class="show-date">
                            Saturday 29 August 2026
                        </p>

                        <p class="show-location">
                            Melbourne
                        </p>

                        <a
                            class="button"
                            href="https://tickets.oztix.com.au/outlet/event/8509e3eb-0afe-4db9-8b72-8463e83e670d"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Tickets
                        </a>

                    </div>

                </div>

            </div>

        </section>



        <!-- =================================================
             VIDEO
             ================================================= -->

        <section
            class="video"
            id="video"
        >


            <!-- BACKGROUND -->

            <img
                class="video-background"
                src="images/backgrounds/stage.png"
                alt=""
                aria-hidden="true"
            >

            <div class="video-background-overlay"></div>


            <!-- FEATURED VIDEO -->

            <div class="video-main">


                <!-- VIDEO TITLE -->

                <p class="video-title">
                    Red Camellia — Trembling (Official Video)
                </p>


                <!-- VIDEO -->

                <div class="video-container">

                    <div
                        class="featured-video featured-video-cover"
                        data-video-id="RBBqYDD9Y9Y"
                    >

                        <img
                            class="featured-video-image"
                            src="images/videos/trembling-official.png"
                            alt="Trembling official music video"
                        >

                        <button
                            class="featured-play-button"
                            type="button"
                            aria-label="Play Trembling official music video"
                        >

                            <i
                                class="fa-solid fa-play"
                                aria-hidden="true"
                            ></i>

                        </button>

                    </div>

                </div>

            </div>


            <!-- SOCIALS / EMAIL -->

            <div class="video-footer">

                <nav
                    class="footer-socials"
                    aria-label="Red Camellia social links"
                >

                    <a
                        href="https://open.spotify.com/artist/2v7xfNq7JK9akvSWFZvmOX?si=IgLIqgGKTV2yJXPdZQ3G4A"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Spotify"
                    >
                        <i class="fa-brands fa-spotify"></i>
                    </a>


                    <a
                        href="https://music.apple.com/us/artist/red-camellia/1870162665"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Apple Music"
                    >
                        <i class="fa-brands fa-apple"></i>
                    </a>


                    <a
                        href="https://www.youtube.com/@redcamelliaband"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="YouTube"
                    >
                        <i class="fa-brands fa-youtube"></i>
                    </a>


                    <a
                        href="https://www.instagram.com/redcamelliaband/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Instagram"
                    >
                        <i class="fa-brands fa-instagram"></i>
                    </a>


                    <a
                        href="https://www.tiktok.com/@redcamelliaband"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="TikTok"
                    >
                        <i class="fa-brands fa-tiktok"></i>
                    </a>

                </nav>


                <a
                    class="footer-email"
                    href="mailto:redcamelliaband@gmail.com"
                >
                    redcamelliaband@gmail.com
                </a>

            </div>


        </section>


    </main>


    <script src="js/script.js"></script>


</body>

</html>
